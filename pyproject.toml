[project]
name = "faceproof"
version = "0.0.101"
description = "FaceProof — Face Evidence Discovery & Blockchain Verification"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Aayush Dubey" }]

# Runtime dependencies.
#
# This set is the union of DeepFace's `requirements.txt` (core framework + REST
# API) plus `tf-keras`, which DeepFace explicitly requires whenever TensorFlow
# ships Keras 3 (see deepface/commons/package_utils.py::validate_for_keras3).
#
# It is sufficient to run the default pipeline and every model this project
# depends on today: face detection / alignment / representation / verification,
# ArcFace (Keras weights, no extra package) and RetinaFace (`retina-face`).
#
# Heavier optional backends (Dlib, YOLO, MediaPipe, FastMtCnn, Buffalo_L,
# anti-spoofing) are lazy-imported by DeepFace and live in the `extra-models`
# optional-dependency group so `uv sync` stays lean.
dependencies = [
    "requests>=2.27.1",
    "numpy>=1.22.0",
    "pandas>=2.0.0",
    "gdown>=4.0.0",
    "tqdm>=4.30.0",
    "Pillow>=9.0.0",
    "opencv-python>=4.9.0.0,<5",  # 5.x ships an empty cv2/data/, breaking DeepFace's default OpenCv Haar-cascade detector
    "tensorflow>=2.13.0",
    "keras>=2.13.0",
    "tf-keras>=2.13.0",
    "Flask>=2.0.2",
    "flask-cors>=4.0.1",
    "mtcnn>=0.1.1",
    "retina-face>=0.0.17",
    "fire>=0.4.0",
    "gunicorn>=20.1.0",
    "lightphe>=0.0.15",
    "lightdsa>=0.0.3",
    "python-dotenv>=1.0.1",
    "web3>=6.0.0",
]

[project.optional-dependencies]
# Non-default model backends. Each is lazy-imported by DeepFace only when the
# matching model / detector is selected. Preserved verbatim from DeepFace's
# `requirements_additional.txt`. Install with: uv sync --extra extra-models
extra-models = [
    "opencv-contrib-python>=4.9.0.0",
    "mediapipe>=0.10.0",
    "dlib>=19.20.0",
    "ultralytics>=8.1.6",
    "facenet-pytorch>=2.5.3",
    "torch>=2.1.2",
    "insightface>=0.7.3",
    "onnxruntime>=1.9.0",
    "typing-extensions",
    "pydantic",
    "albumentations",
]

[project.scripts]
deepface = "face_engine.DeepFace:cli"
face_engine = "face_engine.DeepFace:cli"

[project.urls]
"Face foundation (DeepFace, upstream)" = "https://github.com/serengil/deepface"

[dependency-groups]
# Development-only tooling (testing, linting, type-checking, formatting).
# Installed by default by `uv sync`; skip with `uv sync --no-dev`.
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "pylint>=3.0.0",
    "mypy>=1.8.0",
    "black>=24.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["face_engine", "faceproof"]

[tool.black]
line-length = 100

# Migrated from the removed mypy.ini.
[tool.mypy]
ignore_missing_imports = true
warn_unused_configs = true
warn_unused_ignores = false
strict = true

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]
